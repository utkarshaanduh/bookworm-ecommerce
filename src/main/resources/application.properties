spring.application.name=bookworm-backend
server.port=8080

# PostgreSQL - override with env vars if needed
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookworm}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

# Business rules
bookworm.tax-rate=0.12
bookworm.free-delivery-threshold=500
bookworm.delivery-charge=40
bookworm.cancel-window-hours=48
bookworm.seed-data=true
